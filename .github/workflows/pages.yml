name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Clean image backgrounds
        shell: bash
        run: |
          if command -v magick >/dev/null 2>&1; then IMG=magick; else IMG=convert; fi
          for f in blue coral cream matcha pink yellow; do
            $IMG "$f.webp" -fuzz 5% -fill white \
              -draw "color 0,0 floodfill" \
              -draw "color 807,0 floodfill" \
              -draw "color 0,336 floodfill" \
              -draw "color 807,336 floodfill" \
              "$f-clean.webp"
            mv "$f-clean.webp" "$f.webp"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
